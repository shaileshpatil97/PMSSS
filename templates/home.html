{% extends "layout/public_base.html" %}

{% block content %}
<div class="card p-4">
  <h4>Welcome to PMSSS Scholarship Portal</h4>
  <p>This portal provides online scholarship services for students.</p>
</div>
<div class="card p-4 col-md-5">
<h4>Student Login</h4>
<form method="post">
{% csrf_token %}
{{ form.as_p }}
<a href="{% url 'login' %}" class="btn btn-success">Login</a>
</form>
</div>
<div class="card p-4 col-md-6">
<h4>Student Registration</h4>
<form method="post">
{% csrf_token %}
{{ form.as_p }}
<a href="{% url 'register' %}" class="btn btn-primary">Register</a>
</form>
</div>
{% endblock %}
