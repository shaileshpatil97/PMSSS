{% extends "layout/public_base.html" %}
{% block content %}
<div class="row justify-content-center align-items-center" style="min-height: 75vh;">
    <div class="col-md-7 col-lg-6">
        <div class="glass-card p-5 text-center shadow-lg">
            <h3 class="fw-bold mb-3">Student Registration</h3>
            <p class="text-muted-modern mb-4">Create an account to access the PMSSS Portal</p>
            
            <form method="post" class="text-start">
                {% csrf_token %}
                
                {{ form.as_p }}
                
                <div class="d-grid mt-4">
                    <button type="submit" class="btn btn-modern py-2">Register</button>
                </div>
            </form>
            
            <div class="mt-4">
                <p class="text-muted-modern small mb-0">Already have an account? <a href="/login/" class="text-accent fw-bold text-decoration-none">Login here</a></p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
