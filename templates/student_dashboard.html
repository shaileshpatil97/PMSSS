{% extends "layout/base.html" %}
{% block content %}

<h4>My Applications</h4>

<table class="table table-bordered bg-white">
<tr>
<th>Course</th><th>Institute</th><th>Year</th><th>Status</th>
</tr>
{% for a in apps %}
<tr>
<td>{{a.course}}</td>
<td>{{a.institute_name}}</td>
<td>{{a.year}}</td>
<td>{{a.status}}</td>
</tr>
{% endfor %}
</table>

{% endblock %}
