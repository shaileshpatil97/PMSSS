{% extends "layout/public_base.html" %}
{% block content %}
<div class="card p-4 col-md-5">
  <h4>Institute Login</h4>

  {% if error %}
    <div class="alert alert-danger">{{ error }}</div>
  {% endif %}

  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button class="btn btn-success">Login</button>
  </form>
</div>
{% endblock %}
