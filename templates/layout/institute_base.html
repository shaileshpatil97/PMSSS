<!DOCTYPE html>
<html>
<head>
<title>PMSSS Scholarship Portal</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
.sidebar a{
    display:block;
    padding:10px;
    border-bottom:1px solid #ddd;
    text-decoration:none;
    color:#000;
}
.sidebar a:hover{
    background:#f0f0f0;
}
</style>
</head>
<body class="bg-light">

<div class="bg-primary text-white p-3 d-flex justify-content-between align-items-center">
    <span class="fs-5">PMSSS Scholarship Portal</span>
    <span class="bg-light text-dark px-3 py-1 rounded">
        {{ request.user.aadhaar }}
    </span>
</div>


<div class="container-fluid">
<div class="row">

<!-- Sidebar -->
<div class="col-md-3 bg-white sidebar p-0">
  <a href="{% url 'institute_dashboard' %}">Dashboard</a>
  <a href="{% url 'upload_students' %}">Upload Students CSV</a>
  <a href="{% url 'institute_student_tracking' %}">Student Tracking</a>
  <a href="{% url 'institute_applications' %}">Verify Applications</a>
</div>

<!-- Main content -->
<div class="col-md-9 p-4">
  {% if messages %}
    {% for message in messages %}
      <div class="alert alert-{{ message.tags }}">{{ message }}</div>
    {% endfor %}
  {% endif %}

  {% block content %}{% endblock %}
</div>

</div>
</div>

</body>
</html>
