{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PMSSS Scholarship Dashboard</title>
<!-- Google Fonts: Inter -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<!-- Bootstrap CSS -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<!-- Custom CSS -->
<link rel="stylesheet" href="{% static 'css/style.css' %}">
<style>
/* Glass Sidebar overrides */
.glass-sidebar {
    background: rgba(15, 23, 42, 0.4);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border-right: 1px solid rgba(255,255,255,0.05);
    min-height: calc(100vh - 66px);
}
.glass-sidebar a {
    display: block;
    padding: 16px 24px;
    border-bottom: 1px solid rgba(255,255,255,0.03);
    text-decoration: none;
    color: var(--text-muted);
    transition: all 0.25s ease;
    font-weight: 500;
}
.glass-sidebar a:hover, .glass-sidebar a.active {
    background: rgba(255, 255, 255, 0.08);
    color: var(--color-accent);
    padding-left: 28px;
    border-left: 4px solid var(--color-accent);
}
.top-nav-glass {
    background: rgba(15, 23, 42, 0.7) !important;
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border-bottom: 1px solid rgba(255,255,255,0.05);
}
/* For inputs/buttons inside content */
.dashboard-content .glass-card {
    background: rgba(255, 255, 255, 0.03);
}
</style>
</head>
<body class="bg-gradient-modern m-0 p-0">

<div class="top-nav-glass text-white p-3 px-4 d-flex justify-content-between align-items-center sticky-top shadow-sm">
    <a href="/" class="text-decoration-none"><span class="fs-5 fw-bold text-white">PMSSS <span class="text-accent">Portal</span></span></a>
    <div class="d-flex align-items-center">
        <span class="badge bg-primary px-3 py-2 rounded-pill shadow-sm fw-medium d-none d-md-block">
            <i class="me-1"></i> User: {{ request.user.aadhaar }}
        </span>
        <a href="/login/" class="btn btn-sm btn-outline-light ms-3 rounded-pill px-4">Logout</a>
    </div>
</div>

<div class="container-fluid p-0">
    <div class="row g-0">
        <!-- Sidebar -->
        <div class="col-md-3 col-lg-2 glass-sidebar">
            <a href="{% url 'student_home' %}" class="active">Dashboard</a>
            <a href="{% url 'profile_personal' %}">Profile Settings</a>
            <a href="{% url 'all_schemes' %}">All Schemes</a>
            <a href="{% url 'my_applied' %}">Applied Schemes</a>
            <a href="{% url 'my_cancelled' %}">Cancelled Schemes</a>
            <a href="{% url 'notifications' %}">Notifications</a>
            <a href="{% url 'scheme_history' %}">Scheme History</a>
        </div>

        <!-- Main content -->
        <div class="col-md-9 col-lg-10 p-4 p-md-5 fade-in dashboard-content">
            {% block content %}{% endblock %}
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
