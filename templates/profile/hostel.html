{% extends "layout/base.html" %}
{% block content %}
<div class="container py-2">
    <div class="mx-auto mb-4" style="max-width: 700px;">
        {% include 'profile/_stepper.html' with step=6 %}
    </div>
    <div class="glass-card p-4 p-md-5 mx-auto fade-in" style="max-width: 600px;">
        <h2 class="text-center mb-3 fw-bold">Hostel Details</h2>
        <p class="text-center text-muted-modern mb-4">Please confirm if you are residing in a hostel.</p>

        <form method="post">
            {% csrf_token %}
            
            <div class="glass-card p-3 mb-4 d-flex align-items-center" style="background: #f5f5f7; border: 1px solid #d2d2d7;">
                <div class="form-check form-switch fs-5 mb-0 w-100 d-flex justify-content-between align-items-center">
                    <label class="form-check-label fw-medium m-0" style="color: #1d1d1f;" for="hostel">Are you staying in a hostel?</label>
                    <input class="form-check-input ms-3 shadow-none mt-0" type="checkbox" role="switch" id="hostel" name="hostel" style="width: 3em; height: 1.5em; cursor: pointer;" {% if profile.hostel %}checked{% endif %}>
                </div>
            </div>

            <button type="submit" class="btn btn-modern w-100 mt-2">Finish Setup</button>
        </form>
    </div>
</div>
{% endblock %}
