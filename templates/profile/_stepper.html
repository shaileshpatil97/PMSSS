<div class="d-flex justify-content-between mb-5 px-1 position-relative d-none d-md-flex">
    <div class="position-absolute top-50 start-0 end-0 translate-middle-y"
        style="height: 2px; background: #e0e0e0; z-index: 0; left: 8% !important; right: 8% !important;">
    </div>

    <div class="text-center position-relative" style="z-index: 1;">
        <div class="{% if step >= 1 %}text-white{% else %}text-muted{% endif %} rounded-circle d-flex align-items-center justify-content-center mx-auto mb-2 shadow-sm"

            1</div>
        <small class="{% if step >= 1 %}fw-medium{% else %}text-muted-modern{% endif %} tracking-wide text-uppercase"
