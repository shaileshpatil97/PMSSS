{% extends "layout/base.html" %}
{% block content %}

<h4>Notifications</h4>

<table class="table table-bordered bg-white">
	<tr>
		<th>Message</th>
		<th>Time</th>
	</tr>
	{% for n in notes %}
	<tr>
		<td>{{ n.message }}</td>
		<td>{{ n.created_at }}</td>
	</tr>
	{% empty %}
	<tr><td colspan="2">No notifications.</td></tr>
	{% endfor %}
</table>

{% endblock %}
