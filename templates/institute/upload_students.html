{% extends "layout/institute_base.html" %}
{% block content %}

<div class="d-flex justify-content-between align-items-center mb-4">
    <h4 class="fw-bold mb-0" style="font-size: 28px; letter-spacing: -0.02em;">Upload Student List (CSV)</h4>
</div>

<div class="glass-card p-5" style="border-radius: 20px; max-width: 600px;">
    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        <div class="mb-4">
            <label class="form-label fw-medium text-muted-modern">Select CSV File</label>
            <input type="file" name="file" required class="form-control form-control-lg modern-input">
        </div>
        <button class="btn btn-modern w-100 py-3" style="border-radius: 12px; font-size: 16px;">Upload CSV</button>
    </form>

    <div class="mt-4 p-3 rounded" style="background: rgba(0, 102, 204, 0.05); border: 1px solid rgba(0, 102, 204, 0.1);">
        <p class="mb-1 fw-medium text-primary">Required CSV Format:</p>
        <code class="text-dark bg-white px-2 py-1 rounded shadow-sm border">aadhaar, student_name, course, year</code>
        <p class="mt-2 mb-0 text-muted-modern" style="font-size: 14px;">Please ensure the first row contains these exact headers.</p>
    </div>
</div>

{% endblock %}
